name: Generar pnpm-lock.yaml

# Regenera y commitea pnpm-lock.yaml cuando cambian las dependencias.
# Motivo: el lockfile (~204 KB) excede el limite de tamano de la API de
# contenidos de GitHub usada para subir archivos, asi que se genera aqui
# con la misma version de pnpm que usa el proyecto (12.21.0, ver
# "packageManager" en package.json de la raiz).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "apps/**/package.json"
      - "packages/**/package.json"
      - "pnpm-workspace.yaml"
      - ".github/workflows/lockfile.yml"

permissions:
  contents: write

concurrency:
  group: lockfile
  cancel-in-progress: true

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Resolver dependencias (solo genera el lockfile)
        run: npx --yes pnpm@12.21.0 install --lockfile-only

      - name: Commitear pnpm-lock.yaml si cambio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "pnpm-lock.yaml sin cambios; nada que commitear"
            exit 0
          fi
          git commit -m "Regenera pnpm-lock.yaml con pnpm 12.21.0"
          git push 
